[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cause-xai"
version = "0.1.0"
description = "Causal Attribution Unified Structural Explanation"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Perceive", email = "system.perceive@gmail.com" }
]

keywords = [
    "xai",
    "causal",
    "counterfactual",
    "explainability",
    "additive noise model"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "scikit-learn>=1.0",
    "networkx>=2.7",
    "matplotlib>=3.5",
    "graphviz>=0.20",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23",
    "isort>=5",
    "flake8>=6",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]